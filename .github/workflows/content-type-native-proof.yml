name: Gin Content-Type original native proof
on:
  push:
    branches: [codex/validate-content-type-original]
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Verify unchanged production source
        run: |
          go version
          test "$(git hash-object render/render.go)" = "$(git rev-parse 43fe48e8a0f44af783116cdb010725e6bb50255f:render/render.go)"
          git log -1 --format='%H %an <%ae> %cn <%ce>'
      - name: Original behavior must fail only the new isolation assertion
        run: |
          set +e
          go test -count=1 -v ./render -run '^(TestContentType.*Probe|TestRenderJSON|TestRenderXML)$' > /tmp/gin-red.log 2>&1
          result=$?
          set -e
          cat /tmp/gin-red.log
          test "$result" -ne 0
          grep -q -- '--- FAIL: TestContentTypeHeaderIsolationProbe' /tmp/gin-red.log
          grep -q -- '--- PASS: TestContentTypeExistingHeaderProbe' /tmp/gin-red.log
          grep -q -- '--- PASS: TestRenderJSON' /tmp/gin-red.log
          grep -q -- '--- PASS: TestRenderXML' /tmp/gin-red.log
          test "$(grep -c -- '^--- FAIL:' /tmp/gin-red.log)" -eq 1
      - name: Baseline header allocation benchmark
        run: go test ./render -run '^$' -bench '^BenchmarkContentTypeHeaderIsolation$' -benchmem -count=3
