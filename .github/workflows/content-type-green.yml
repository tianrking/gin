name: Gin Content-Type exact native quality
on:
  push:
    branches: [codex/validate-content-type-original]
permissions:
  contents: read
env:
  FORMAL_SHA: bdf3f9ce994ef6e0ca8554732ebd739d5df81941
  GOMAXPROCS: '2'
jobs:
  native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bdf3f9ce994ef6e0ca8554732ebd739d5df81941
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Verify exact source before tests
        run: |
          test "$(git rev-parse HEAD)" = "$FORMAL_SHA"
          go version
          git log -1 --format='%H %an <%ae> %cn <%ce>'
          git hash-object render/render.go render/render_test.go context_test.go
      - name: Focused regression and original probe GREEN
        run: |
          go test -count=1 -v ./render -run '^(TestRendererContentType.*|TestWriteContentType.*)$'
          go test -count=1 -v . -run '^TestContextRendererContentTypeIsolation$'
          git show 34dea289665808dfea2a12d47fad95d49998578c:render/content_type_probe_test.go > render/content_type_probe_test.go
          go test -count=1 -v ./render -run '^TestContentType.*Probe$'
          go test ./render -run '^$' -bench '^BenchmarkContentTypeHeaderIsolation$' -benchmem -count=3
          rm render/content_type_probe_test.go
      - name: Full project tests and coverage
        run: go test -p 2 -count=1 -coverprofile=/tmp/gin-coverage.out ./...
      - name: Full project race tests
        run: go test -p 2 -race -count=1 ./...
      - name: Full project tests for configured alternate codecs
        run: |
          go test -p 2 -count=1 -tags nomsgpack ./...
          go test -p 2 -count=1 -tags go_json ./...
          go test -p 2 -count=1 -tags sonic -ldflags='-checklinkname=0' ./...
      - name: Full vet and source unchanged after tests
        run: |
          go vet -p 2 ./...
          test -z "$(git status --porcelain)"
          git hash-object render/render.go render/render_test.go context_test.go
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bdf3f9ce994ef6e0ca8554732ebd739d5df81941
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - name: Install repository configured lint version
        run: |
          curl -fsSL https://raw.githubusercontent.com/golangci/golangci-lint/v2.11.0/install.sh -o /tmp/install-golangci.sh
          sh /tmp/install-golangci.sh -b /tmp/gin-tools v2.11.0
          /tmp/gin-tools/golangci-lint version
      - name: Generate formatting artifact and show current lint diagnostics
        run: |
          /tmp/gin-tools/golangci-lint fmt
          git diff --stat
          /tmp/gin-tools/golangci-lint run --verbose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gin-formatted-source
          path: |
            render/render.go
            render/render_test.go
            context_test.go
